[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nkx21"
version = "1.0.1"
description = "Trained models and code for quantifying the effects of single nucleotide variants in NKX2.1 transcription factor binding sites"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sebastian Proft" }]
keywords = ["NKX2.1", "transcription factor", "binding site", "deep learning", "EMSA-seq"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Inference needs only PyTorch. Versions below match the training environment;
# the released weights are plain state_dicts and load on any modern PyTorch.
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7", "pandas>=2.0", "scikit-learn>=1.3"]
attribution = ["tangermeme==0.4.2", "captum==0.8.0", "logomaker==0.8", "modisco-lite==2.2.1"]
# Preprocessing, training and attribution are provided by tfbs-mcp, a companion library that is in
# preparation and not yet formally released. It is pinned to an immutable commit so a reinstall
# cannot silently change the code, and it is optional: inference does not need it, because the model
# definitions required to load the released weights are vendored in src/nkx21/models.py. A direct
# git reference (installable from a checkout, not from PyPI); a released, versioned form will
# supersede this pin when it is available.
pipeline = [
    "tfbs-mcp @ git+https://github.com/sproft/tfbs-mcp.git@c86c6ef2f6dab24dfeffddc97dd8ed269d89bbdc",
]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/sproft/nkx2-1-tfbs-variants"
Library = "https://github.com/sproft/tfbs-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
